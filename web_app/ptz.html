<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Sterowanie PTZ i IR</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 16px; }
    .row { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button { padding: 6px 10px; }
    img { max-width: 720px; width: 100%; cursor: crosshair; border: 1px solid #444; display: block; margin-top: 10px; }
    pre { background: #1c1c1c; padding: 8px; border: 1px solid #333; max-width: 720px; }
    a { color: #6cf; }
  </style>
</head>
<body>
  <div class="row"><a href="/">Podglad</a></div>
  <div class="row">
    <button onclick="send('cmd=pan&dir=0&steps=15')">Pan L (15)</button>
    <button onclick="send('cmd=pan&dir=1&steps=15')">Pan P (15)</button>
    <button onclick="send('cmd=tilt&dir=1&steps=10')">Tilt G (10)</button>
    <button onclick="send('cmd=tilt&dir=0&steps=10')">Tilt D (10)</button>
  </div>
  <div class="row">
    X: <input id="gx" type="number" value="0" style="width:70px">
    Y: <input id="gy" type="number" value="0" style="width:70px">
    <button onclick="gotoCoords()">Goto X,Y</button>
  </div>
  <div class="row">
    IR-LED:
    <button onclick="send('cmd=irled&val=1')">Wl</button>
    <button onclick="send('cmd=irled&val=0')">Wyl</button>
    IR-Cut:
    <button onclick="send('cmd=ircut&val=1')">1</button>
    <button onclick="send('cmd=ircut&val=0')">0</button>
  </div>
  <pre id="out">Gotowe</pre>
  <img id="view" src="/cgi-bin/snap.cgi?t=1" onclick="clickMove(event)" alt="Kliknij aby przesunac">
  <script>
    const out = document.getElementById("out");
    const view = document.getElementById("view");

    async function send(qs) {
      out.textContent = "Wysylanie: " + qs;
      const r = await fetch("/cgi-bin/ptz.cgi?" + qs);
      out.textContent = await r.text();
      view.src = "/cgi-bin/snap.cgi?t=" + Date.now();
    }

    function gotoCoords() {
      const x = document.getElementById("gx").value;
      const y = document.getElementById("gy").value;
      send("cmd=goto&x=" + encodeURIComponent(x) + "&y=" + encodeURIComponent(y));
    }

    function clickMove(e) {
      const rect = view.getBoundingClientRect();
      const nx = (e.clientX - rect.left) / rect.width - 0.5;
      const ny = (e.clientY - rect.top) / rect.height - 0.5;
      const dx = Math.round(nx * 40);
      const dy = Math.round(-ny * 25);
      if (dx !== 0) send("cmd=pan&dir=" + (dx > 0 ? 1 : 0) + "&steps=" + Math.abs(dx));
      if (dy !== 0) send("cmd=tilt&dir=" + (dy > 0 ? 1 : 0) + "&steps=" + Math.abs(dy));
    }
  </script>
</body>
</html>
