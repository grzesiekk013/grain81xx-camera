<!doctype html>
<html lang="pl" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRAIN PREVIEW Grzegorz Lademann</title>
  <link rel="stylesheet" href="/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
  <div class="container py-3" style="max-width: 900px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="d-flex align-items-center gap-2">
        <button id="btnStream" class="btn btn-primary btn-sm" onclick="toggleStream()">Stop stream</button>
        <span id="status" class="badge text-bg-success">Stream: LIVE</span>
      </div>
      <a href="/ptz.html" class="btn btn-outline-info btn-sm" onclick="stopStream()">Panel PTZ / IR</a>
    </div>
    <div class="card bg-black border-secondary overflow-hidden">
      <img id="cam" src="/cgi-bin/stream.cgi" class="img-fluid w-100" alt="Podglad">
    </div>
  </div>
  <script>
    const img = document.getElementById("cam");
    const statusEl = document.getElementById("status");
    const btnStream = document.getElementById("btnStream");
    let active = true;
    let retryTimer = null;

    function startStream() {
      clearTimeout(retryTimer);
      active = true;
      btnStream.className = "btn btn-primary btn-sm";
      btnStream.textContent = "Stop stream";
      statusEl.className = "badge text-bg-success";
      statusEl.textContent = "Stream: LIVE";
      img.src = "/cgi-bin/stream.cgi?t=" + Date.now();
    }

    function stopStream() {
      clearTimeout(retryTimer);
      active = false;
      btnStream.className = "btn btn-outline-primary btn-sm";
      btnStream.textContent = "Start stream";
      statusEl.className = "badge text-bg-secondary";
      statusEl.textContent = "Stream: paused";
      img.src = "";
    }

    function toggleStream() {
      if (active) stopStream();
      else startStream();
    }

    img.onerror = () => {
      if (!active) return;
      statusEl.className = "badge text-bg-warning";
      statusEl.textContent = "Stream: reconnect...";
      retryTimer = setTimeout(() => {
        if (active) img.src = "/cgi-bin/stream.cgi?t=" + Date.now();
      }, 1000);
    };

    window.addEventListener("pagehide", () => { img.src = ""; });
  </script>
</body>
</html>
